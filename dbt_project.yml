name: 'package_health'
version: '1.0.0'

profile: 'package_health'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  package_health:
    staging:
      +materialized: view   # cheap, always reflect the raw tables
    marts:
      +materialized: table  # rebuilt every run, read by validation, scoring and plots
