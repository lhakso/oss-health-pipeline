version: 2

# run time = max(fetched_at) in the raw tables, so a rebuild on the same data gives the same results
models:
  - name: fct_pull_requests
    description: One row per PR created on or after 2024-01-01. Open PRs are kept and flagged, never given a close date.
    data_tests:
      - unique:
          arguments:
            column_name: "repo || '#' || number"
    columns:
      - name: repo
        description: owner/name of the repository.
        data_tests: [not_null]
      - name: number
        description: PR number.
        data_tests: [not_null]
      - name: login
        description: PR author.
      - name: is_bot
        description: PR author matches the bot rule.
      - name: state
        description: open or closed.
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: When the PR was opened.
        data_tests: [not_null]
      - name: updated_at
        description: Last activity on the PR.
      - name: closed_at
        description: When the PR was closed; null if open.
      - name: merged_at
        description: When the PR was merged; null unless merged.
      - name: is_merged
        description: merged_at is not null.
      - name: is_closed_unmerged
        description: Closed without being merged.
      - name: is_open
        description: Still open at run time.
      - name: first_review_at
        description: Earliest review not by the PR author and not by a bot.
      - name: hours_to_first_review
        description: Hours from created_at to first_review_at; null if never reviewed.
      - name: reviewed_within_7d
        description: hours_to_first_review <= 168; false if never reviewed.
      - name: review_window_closed
        description: Created at least 7 days before run time, so reviewed_within_7d is final.
      - name: in_recent_window
        description: Created in the 6 complete months before the run month (the window responsiveness is scored on).
      - name: hours_to_merge
        description: Hours from created_at to merged_at; null unless merged.
      - name: hours_to_close
        description: Hours from created_at to closed_at (merged or not); null if open.
      - name: is_stale
        description: Open and not updated in the 180 days before run time.
      - name: has_approving_review
        description: Has an APPROVED review by someone other than the author and not a bot.

  - name: fct_releases
    description: One row per published release on or after 2024-01-01.
    data_tests:
      - unique:
          arguments:
            column_name: "repo || '#' || id"
    columns:
      - name: repo
        description: owner/name of the repository.
        data_tests: [not_null]
      - name: id
        description: Release id.
        data_tests: [not_null]
      - name: tag_name
        description: Git tag of the release.
      - name: published_at
        description: When the release was published.
        data_tests: [not_null]
      - name: days_since_previous
        description: Days since the repo's previous release; lag computed before the window filter, so the first in-window release still has a gap.
      - name: is_prerelease
        description: True for pre-releases.

  - name: mart_repo_monthly
    description: One row per repo per month, January 2024 through the run month; months with no activity show 0.
    data_tests:
      - unique:
          arguments:
            column_name: "repo || '#' || month"
    columns:
      - name: repo
        description: owner/name of the repository.
        data_tests: [not_null]
      - name: month
        description: First day of the month.
        data_tests: [not_null]
      - name: prs_opened
        description: PRs created this month.
      - name: prs_merged
        description: PRs merged this month.
      - name: prs_closed_unmerged
        description: PRs closed without merging this month.
      - name: merge_ratio
        description: prs_merged / (prs_merged + prs_closed_unmerged); null when nothing was closed.
      - name: pct_reviewed_within_7d
        description: Share of PRs opened this month reviewed within 7 days, over PRs whose 7 days are over.
      - name: median_first_review_hours
        description: Median hours to first review of PRs opened this month; unreviewed PRs are excluded.
      - name: pct_still_open
        description: Share of PRs opened this month that are still open at run time.
      - name: median_merge_hours
        description: Median hours to merge of PRs merged this month.
      - name: commits
        description: Commits authored this month.
      - name: active_contributors
        description: Distinct non-bot PR authors who opened a PR this month.
      - name: is_partial_month
        description: True for the run month, which is not finished.

  # one column per metric in the health score
  - name: mart_health_inputs
    description: One row per repo; every column is a rate, share, median, or slope, never a raw count.
    columns:
      - name: repo
        description: owner/name of the repository.
        data_tests: [unique, not_null]
      - name: pct_reviewed_within_7d
        description: Responsiveness, higher is healthier. Share of PRs reviewed within 7 days, over PRs in the recent window (6 complete months before the run month) created at least 7 days before run time.
      - name: median_hours_to_first_review
        description: Responsiveness, lower is healthier. Median hours from PR creation to first non-author, non-bot review, over PRs in the recent window; unreviewed PRs are excluded.
      - name: pct_open_stale
        description: Backlog, lower is healthier. Share of open PRs with no activity in the 180 days before run time; 0 when no PRs are open.
      - name: commit_trend
        description: Activity trend, higher is healthier. regr_slope(commits, month_index) over complete months divided by mean monthly commits, i.e. % change per month relative to the repo's own level.
